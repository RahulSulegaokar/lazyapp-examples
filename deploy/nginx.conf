# nginx site for demo.lazyapp.in → the demo server on 127.0.0.1:8787.
# TLS via certbot: sudo certbot --nginx -d demo.lazyapp.in
server {
    listen 80;
    server_name demo.lazyapp.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name demo.lazyapp.in;

    ssl_certificate     /etc/letsencrypt/live/demo.lazyapp.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.lazyapp.in/privkey.pem;

    # Webhook bodies are small; the app also enforces 1 MB.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Signatures cover the raw body: never let a proxy rewrite it.
        proxy_request_buffering on;
        proxy_read_timeout 15s;
    }
}
